name: Deploy OTA bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ota-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 시크릿이 비어 있으면 지도 키가 빠진 번들이 운영에 올라간다. 빌드 전에 멈춘다.
      - name: Check required secrets
        env:
          VITE_NAVER_CLIENT_ID: ${{ secrets.VITE_NAVER_CLIENT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$VITE_NAVER_CLIENT_ID" ] || missing="$missing VITE_NAVER_CLIENT_ID"
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "필수 시크릿이 설정되지 않았습니다:$missing" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_NAVER_CLIENT_ID: ${{ secrets.VITE_NAVER_CLIENT_ID }}

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes wrangler@4.141.0 pages deploy dist
          --project-name share-water-ota
          --branch main
          --commit-dirty=true

      # 배포된 manifest가 방금 빌드한 번들과 같은지 확인한다(체크섬 포함).
      - name: Verify published bundle
        run: npm run ota:verify
